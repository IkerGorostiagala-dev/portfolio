<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iker | Programador</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            font-size: 20px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            background: #38bdf8;
        }

        .buttons a:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">

            <h1>Hola, soy <span>Iker</span></h1>

            <p>
                Programador apasionado,
                resolver problemas y construir soluciones confiables.
            </p>

            <div class="buttons">
                <a href="https://github.com/">GitHub</a>
                <a href="https://linkedin.com/">LinkedIn</a>
            </div>

        </div>
    </header>

</body>
</html>
